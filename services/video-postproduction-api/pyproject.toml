[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-video-postproduction-api"
version = "0.1.0"
description = "Local-first AI post-production API and worker"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.6,<3",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "pythainlp>=5.1,<6",
  "redis>=5.2,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.8,<1",
]
transcription = [
  "faster-whisper>=1.1,<2",
  # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2 decode_audio passes.
  "av>=11,<19",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"video_postproduction/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
