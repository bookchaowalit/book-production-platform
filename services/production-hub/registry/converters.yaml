# Everything-as-Spec conversion graph (spec 2026-09-30-everything-as-spec §4).
#
# Each converter turns one of `from` (any one is enough; `with` lists optional
# extra inputs) into every format or effect in `to`.
#   status  implemented = runs in Solo-Empire today (tool is a catalog tool or
#                         production-hub; `handoff` links the Hub edge)
#           available   = a free/open tool can do it; not integrated yet and
#                         `requires` names the runtime that must be approved
#           planned     = on the roadmap (Hub handoff or tool feature)
#   level   L1 generate, L2 simulate, L3 validate, L4 prepare an action package,
#           L6 execute in the world. L6 needs `approval: human` and can never
#           exceed the target domain's max_level.
schema_version: converters.v1

converters:
  # --- implemented inside Solo-Empire tools
  - {id: documents-render, from: [document-request], to: [document-ir, pdf, docx], tool: documents-v1a, level: L1, status: implemented}
  - {id: transcript-to-documents, from: [transcript], to: [pdf, docx], tool: documents-v1a, level: L1, status: implemented, handoff: T6.2-transcript-to-documents}
