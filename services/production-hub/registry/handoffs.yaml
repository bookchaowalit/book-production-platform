# Cross-tool handoff edges. `implemented` edges run today and must cite a
# request contract and evidence file; `planned` edges are the Production Hub
# backlog (spec 2026-09-30 §3.4) and may use request_contract: tbd.
# from_tool `external` means the kind enters from outside the catalog (for
# example a client-supplied GLB). to_tool `production-hub` is the Hub itself.
