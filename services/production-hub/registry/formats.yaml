  vtt: {domain: video, ext: [.vtt], media: text/vtt, text: generated, roles: [artifact], kinds: [captions.vtt]}
  lottie: {domain: video, ext: [.json], media: application/json, text: generated, roles: [source, artifact]}
  remotion: {domain: video, ext: [.tsx], media: text/plain, text: authored, roles: [source]}
  manim: {domain: video, ext: [.py], media: text/x-python, text: authored, roles: [source]}
  video-request: {domain: video, ext: [.json], media: application/json, text: authored, roles: [source], note: "video-remux.v1, video-overlay.v1"}
  mp4: {domain: video, ext: [.mp4, .mov, .webm, .mkv], media: video/mp4, text: binary, roles: [source, artifact], kinds: [video.source, video.render]}
  # --- marketing
  campaign-request: {domain: marketing, ext: [.json], media: application/json, text: authored, roles: [source], note: campaign-request.v1}
  campaign-package: {domain: marketing, ext: [.json], media: application/json, text: generated, roles: [artifact], kinds: [campaign.package]}
  copy-text: {domain: marketing, ext: [.txt], media: text/plain, text: generated, roles: [artifact], kinds: [copy.text]}
  mjml: {domain: marketing, ext: [.mjml], media: text/plain, text: authored, roles: [source]}
