  openscad: {domain: cad, ext: [.scad], media: text/plain, text: authored, roles: [source]}
  fcstd: {domain: cad, ext: [.fcstd], media: application/x-freecad, text: binary, roles: [artifact], kinds: [cad.fcstd]}
  step: {domain: cad, ext: [.step, .stp], media: model/step, text: generated, roles: [artifact], kinds: [cad.step]}
  stl: {domain: cad, ext: [.stl], media: model/stl, text: binary, roles: [artifact], kinds: [cad.stl]}
  three-mf: {domain: fabrication, ext: [.3mf], media: model/3mf, text: generated, roles: [artifact]}
  dxf: {domain: cad, ext: [.dxf], media: image/vnd.dxf, text: generated, roles: [source, artifact]}
  ifc: {domain: bim, ext: [.ifc], media: application/x-step, text: generated, roles: [source, artifact], kinds: [bim.ifc]}
  ifcopenshell-script: {domain: bim, ext: [.py], media: text/x-python, text: authored, roles: [source]}
  gbxml: {domain: bim, ext: [.gbxml, .xml], media: application/xml, text: generated, roles: [artifact]}
  game-ir: {domain: games, ext: [.json], media: application/json, text: authored, roles: [source], note: "game-ir.v1, game-ir.v2"}
  unity-project: {domain: games, ext: [.zip], media: application/zip, text: generated, roles: [artifact], kinds: [game.unity-project], note: scenes are Unity YAML}
  webgl-build: {domain: games, ext: [.zip], media: application/zip, text: binary, roles: [artifact], kinds: [game.build]}
  level-data: {domain: games, ext: [.tmj, .ldtk, .tscn], media: application/json, text: authored, roles: [source]}
  shader: {domain: gpu, ext: [.glsl, .wgsl, .hlsl, .metal, .cu], media: text/plain, text: authored, roles: [source]}
  geojson: {domain: gis, ext: [.geojson, .kml, .gpx], media: application/geo+json, text: authored, roles: [source, artifact]}
  vector-tiles: {domain: gis, ext: [.pmtiles, .mbtiles], media: application/octet-stream, text: binary, roles: [artifact]}
  # --- business
  ledger: {domain: business, ext: [.beancount, .journal], media: text/plain, text: authored, roles: [source]}
  business-yaml: {domain: business, ext: [.yaml], media: application/yaml, text: authored, roles: [source], note: "pricing, products, customers"}
  e-tax-invoice: {domain: business, ext: [.xml], media: application/xml, text: generated, roles: [artifact], note: ETDA e-Tax invoice}
  promptpay-qr: {domain: business, ext: [.txt], media: text/plain, text: generated, roles: [artifact], note: EMVCo payload}
  icalendar: {domain: business, ext: [.ics], media: text/calendar, text: generated, roles: [artifact]}
