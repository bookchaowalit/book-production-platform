# Everything-as-Spec format registry (spec 2026-09-30-everything-as-spec §3).
#
# domains:  what a domain covers and the highest automation level (L0-L6) any
#           converter into it may reach; L5+ always needs a human decision.
# formats:  file formats by id. text = authored (people/agents edit it, lives
#           in git) | generated (text a tool writes; diff it, never hand-edit)
#           | binary. roles = source | ir | artifact. kinds = Production Hub
#           artifact kinds stored in this format.
# effects:  what happens in the world when an artifact is used; reachable only
#           through an L6 converter.
schema_version: formats.v1

levels:
  L0: read
  L1: generate
  L2: simulate
  L3: validate
  L4: prepare an action package
  L5: human approval
  L6: execute in the world

domains:
  documents: {label: เอกสาร, max_level: L6}
  presentation: {label: สไลด์, max_level: L4}
  diagrams: {label: ไดอะแกรม, max_level: L4}
  graphics: {label: กราฟิกและภาพ, max_level: L4}
  typography: {label: ฟอนต์และแบรนด์, max_level: L4}
  data: {label: ข้อมูลและกราฟ, max_level: L4}
  spreadsheets: {label: ตารางคำนวณ, max_level: L4}
  web: {label: เว็บ, max_level: L6}
  software: {label: ซอฟต์แวร์และแอป, max_level: L6}
  api: {label: สัญญา API, max_level: L4}
  database: {label: ฐานข้อมูล, max_level: L6}
  infrastructure: {label: Infra และ Cloud, max_level: L6}
  ci: {label: CI/CD, max_level: L6}
  workflow: {label: Workflow และ automation, max_level: L6}
  agents: {label: Agent และ AI, max_level: L4}
  audio: {label: เสียงและดนตรี, max_level: L4}
  video: {label: วิดีโอและแอนิเมชัน, max_level: L4}
  three-d: {label: 3D, max_level: L4}
  cad: {label: CAD, max_level: L4}
  bim: {label: BIM และอาคาร, max_level: L4}
  games: {label: เกมและโลกเสมือน, max_level: L4}
  gpu: {label: Shader และ GPU, max_level: L4}
  gis: {label: GIS และแผนที่, max_level: L4}
  business: {label: ธุรกิจและบัญชี, max_level: L4, note: ไม่สั่งจ่ายเงินหรือยื่นภาษีเอง — เตรียมไฟล์ให้คนส่ง}
  marketing: {label: การตลาด, max_level: L6, note: เผยแพร่ได้หลังคนอนุมัติทีละครั้ง}
  knowledge: {label: คลังความรู้, max_level: L4}
  localization: {label: หลายภาษา, max_level: L4}
  security: {label: Security และ policy, max_level: L4}
  observability: {label: Monitoring, max_level: L4}
  fabrication: {label: "ผลิตชิ้นงาน (3D print, CNC, laser, ป้าย, ปัก)", max_level: L6}
  electronics: {label: อิเล็กทรอนิกส์และ PCB, max_level: L6, note: สั่งผลิตคือการใช้เงิน ต้องอนุมัติ}
  firmware: {label: Firmware และ IoT, max_level: L6, note: flash อุปกรณ์ต้องอนุมัติทีละครั้ง}
  home: {label: บ้านอัจฉริยะ, max_level: L6}
  hardware-design: {label: FPGA และชิป, max_level: L2, note: จำลองเท่านั้น}
  robotics: {label: หุ่นยนต์, max_level: L2, note: จำลองเท่านั้นจนมี design gate ด้านความปลอดภัย}
  industrial: {label: โรงงานและ PLC, max_level: L2, note: จำลองเท่านั้น}
  vehicles: {label: โดรนและยานยนต์, max_level: L2, note: จำลองเท่านั้น (กฎหมายการบินและความปลอดภัย)}
  simulation: {label: Simulation วิศวกรรม, max_level: L2}
  ml: {label: Machine learning, max_level: L4}
  science: {label: วิทยาศาสตร์, max_level: L0, note: อ่านและวิเคราะห์เท่านั้น ไม่ต่อไปถึงการสังเคราะห์}
  finance-institutional: {label: การเงินสถาบัน, max_level: L0, note: อ่านและรายงานเท่านั้น ไม่เทรดหรือโอน}

formats:
  # --- documents / publishing
  markdown: {domain: documents, ext: [.md], media: text/markdown, text: authored, roles: [source], kinds: [workflow.plan]}
  typst: {domain: documents, ext: [.typ], media: text/x-typst, text: authored, roles: [source]}
  latex: {domain: documents, ext: [.tex], media: application/x-tex, text: authored, roles: [source]}
  asciidoc: {domain: documents, ext: [.adoc], media: text/asciidoc, text: authored, roles: [source]}
  document-request: {domain: documents, ext: [.json], media: application/json, text: authored, roles: [source], note: invoice/quotation/proposal/report/spec-sheet request contracts}
  document-ir: {domain: documents, ext: [.json], media: application/json, text: generated, roles: [ir]}
  transcript: {domain: documents, ext: [.json], media: application/json, text: generated, roles: [ir], kinds: [transcript]}
  html: {domain: web, ext: [.html, .htm], media: text/html, text: authored, roles: [source, artifact], kinds: [web.page]}
  pdf: {domain: documents, ext: [.pdf], media: application/pdf, text: binary, roles: [artifact], kinds: [document.pdf, graphic.pdf, cad.drawing.pdf, document.scan]}
  docx: {domain: documents, ext: [.docx], media: application/vnd.openxmlformats-officedocument.wordprocessingml.document, text: generated, roles: [artifact], kinds: [document.docx], note: zipped XML}
  epub: {domain: documents, ext: [.epub], media: application/epub+zip, text: generated, roles: [artifact]}
  # --- presentation / diagrams
  marp: {domain: presentation, ext: [.md], media: text/markdown, text: authored, roles: [source]}
  pptx: {domain: presentation, ext: [.pptx], media: application/vnd.openxmlformats-officedocument.presentationml.presentation, text: generated, roles: [artifact]}
  mermaid: {domain: diagrams, ext: [.mmd], media: text/vnd.mermaid, text: authored, roles: [source]}
  d2: {domain: diagrams, ext: [.d2], media: text/plain, text: authored, roles: [source]}
  plantuml: {domain: diagrams, ext: [.puml], media: text/plain, text: authored, roles: [source]}
  graphviz: {domain: diagrams, ext: [.dot, .gv], media: text/vnd.graphviz, text: authored, roles: [source]}
  # --- graphics / images / typography
  graphics-request: {domain: graphics, ext: [.json], media: application/json, text: authored, roles: [source], note: graphics-batch.v1}
  svg: {domain: graphics, ext: [.svg], media: image/svg+xml, text: generated, roles: [source, artifact], kinds: [chart.svg, graphic.svg]}
  png: {domain: graphics, ext: [.png], media: image/png, text: binary, roles: [artifact], kinds: [chart.png, graphic.png, image.render, document.scan]}
  jpeg: {domain: graphics, ext: [.jpg, .jpeg], media: image/jpeg, text: binary, roles: [artifact], kinds: [graphic.png, document.scan]}
  webp: {domain: graphics, ext: [.webp], media: image/webp, text: binary, roles: [artifact]}
  tiff: {domain: graphics, ext: [.tif, .tiff], media: image/tiff, text: binary, roles: [artifact], kinds: [document.scan]}
  brand-kit: {domain: typography, ext: [.json], media: application/json, text: authored, roles: [source], kinds: [brand.kit], note: brand-kit.v1}
  design-tokens: {domain: typography, ext: [.json], media: application/json, text: authored, roles: [source]}
  font: {domain: typography, ext: [.ttf, .otf, .woff2], media: font/ttf, text: binary, roles: [artifact], kinds: [font.file]}
  # --- data / spreadsheets
  csv: {domain: data, ext: [.csv, .tsv], media: text/csv, text: authored, roles: [source, artifact], kinds: [dataset.table, bim.takeoff]}
  jsonl: {domain: data, ext: [.jsonl], media: application/jsonl, text: generated, roles: [source, artifact]}
  sql: {domain: database, ext: [.sql], media: application/sql, text: authored, roles: [source], kinds: [sql.pipeline]}
  vega-lite: {domain: data, ext: [.vl.json], media: application/json, text: authored, roles: [source]}
  pipeline-request: {domain: data, ext: [.json], media: application/json, text: authored, roles: [source], note: data pipeline spec}
  data-job: {domain: data, ext: [.json], media: application/json, text: authored, roles: [source], note: data-viz job request}
  parquet: {domain: data, ext: [.parquet], media: application/vnd.apache.parquet, text: binary, roles: [artifact]}
  workbook-request: {domain: spreadsheets, ext: [.json], media: application/json, text: authored, roles: [source], note: workbook-request.v1}
  xlsx: {domain: spreadsheets, ext: [.xlsx], media: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text: generated, roles: [artifact], kinds: [workbook.xlsx]}
  takeoff-json: {domain: bim, ext: [.json], media: application/json, text: generated, roles: [artifact], kinds: [bim.takeoff]}
  # --- web / software / api / infra
  page-request: {domain: web, ext: [.json], media: application/json, text: authored, roles: [source], note: page-request.v1}
  css: {domain: web, ext: [.css, .scss], media: text/css, text: authored, roles: [source, artifact], kinds: [web.page]}
  tsx: {domain: web, ext: [.tsx, .jsx, .vue, .svelte], media: text/plain, text: authored, roles: [source]}
  web-bundle: {domain: web, ext: [.zip], media: application/zip, text: binary, roles: [artifact], kinds: [web.page]}
  program-source: {domain: software, ext: [.py, .ts, .js, .go, .rs, .cs, .java, .kt, .swift, .dart, .lua], media: text/plain, text: authored, roles: [source]}
  shell: {domain: software, ext: [.sh, .ps1, .bat], media: text/plain, text: authored, roles: [source]}
  executable: {domain: software, ext: [.exe, .dll, .so, .dylib, .apk], media: application/octet-stream, text: binary, roles: [artifact]}
  wasm: {domain: software, ext: [.wasm], media: application/wasm, text: binary, roles: [artifact]}
  container-image: {domain: software, ext: [.tar], media: application/vnd.oci.image.layer.v1.tar, text: binary, roles: [artifact]}
  openapi: {domain: api, ext: [.openapi.yaml, .openapi.json], media: application/yaml, text: authored, roles: [source]}
  json-schema: {domain: api, ext: [.schema.json], media: application/schema+json, text: authored, roles: [source]}
  graphql: {domain: api, ext: [.graphql], media: application/graphql, text: authored, roles: [source]}
  protobuf: {domain: api, ext: [.proto], media: text/plain, text: authored, roles: [source]}
  terraform: {domain: infrastructure, ext: [.tf, .hcl], media: text/plain, text: authored, roles: [source]}
  terraform-plan: {domain: infrastructure, ext: [.tfplan.json], media: application/json, text: generated, roles: [ir]}
  dockerfile: {domain: infrastructure, ext: [Dockerfile, .dockerfile], media: text/plain, text: authored, roles: [source]}
  compose: {domain: infrastructure, ext: [compose.yaml, docker-compose.yml], media: application/yaml, text: authored, roles: [source]}
  kubernetes: {domain: infrastructure, ext: [.yaml], media: application/yaml, text: authored, roles: [source], note: "manifests, Helm templates"}
  ansible: {domain: infrastructure, ext: [.yml], media: application/yaml, text: authored, roles: [source]}
  nix: {domain: infrastructure, ext: [.nix], media: text/plain, text: authored, roles: [source]}
  ci-workflow: {domain: ci, ext: [.github/workflows/*.yml, .gitlab-ci.yml], media: application/yaml, text: authored, roles: [source]}
  # --- workflow / agents / knowledge / localization / security / observability
  workflow-ir: {domain: workflow, ext: [.json], media: application/json, text: authored, roles: [source], kinds: [workflow.plan]}
  product-spec: {domain: workflow, ext: [product.yaml], media: application/yaml, text: authored, roles: [source], note: product.v1}
  hub-flow: {domain: workflow, ext: [.json], media: application/json, text: authored, roles: [source], note: hub-flow.v1}
  bpmn: {domain: workflow, ext: [.bpmn], media: application/xml, text: generated, roles: [source]}
  agent-instructions: {domain: agents, ext: [SKILL.md, AGENTS.md, .prompt.md], media: text/markdown, text: authored, roles: [source]}
  eval-suite: {domain: agents, ext: [.yaml], media: application/yaml, text: authored, roles: [source]}
  rdf: {domain: knowledge, ext: [.ttl, .jsonld], media: text/turtle, text: authored, roles: [source, artifact]}
  notebook: {domain: knowledge, ext: [.ipynb], media: application/x-ipynb+json, text: generated, roles: [source]}
  gettext: {domain: localization, ext: [.po, .xliff, .arb], media: text/x-gettext-translation, text: authored, roles: [source]}
  rego: {domain: security, ext: [.rego], media: text/plain, text: authored, roles: [source]}
  detection-rules: {domain: security, ext: [.yar, .rules, .sigma.yml], media: text/plain, text: authored, roles: [source]}
  sbom: {domain: security, ext: [.cdx.json, .spdx.json], media: application/json, text: generated, roles: [artifact]}
  monitoring-config: {domain: observability, ext: [.rules.yml, .dashboard.json], media: application/yaml, text: authored, roles: [source]}
  # --- audio / video
  audio-batch: {domain: audio, ext: [.json], media: application/json, text: authored, roles: [source], note: audio-batch.v1}
  ssml: {domain: audio, ext: [.ssml], media: application/ssml+xml, text: authored, roles: [source]}
  midi: {domain: audio, ext: [.mid], media: audio/midi, text: binary, roles: [source, artifact]}
  music-notation: {domain: audio, ext: [.musicxml, .abc, .ly], media: application/vnd.recordare.musicxml+xml, text: authored, roles: [source]}
  wav: {domain: audio, ext: [.wav], media: audio/wav, text: binary, roles: [artifact], kinds: [audio.track, audio.master]}
  flac: {domain: audio, ext: [.flac], media: audio/flac, text: binary, roles: [artifact], kinds: [audio.track]}
  mp3: {domain: audio, ext: [.mp3], media: audio/mpeg, text: binary, roles: [artifact]}
  ogg: {domain: audio, ext: [.ogg], media: audio/ogg, text: binary, roles: [artifact]}
  edl: {domain: video, ext: [.json], media: application/json, text: authored, roles: [source], kinds: [edl]}
  otio: {domain: video, ext: [.otio], media: application/json, text: generated, roles: [source]}
