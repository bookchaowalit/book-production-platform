[project]
name = "solo-empire-data-production-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141.1,<1.0", "pydantic>=2.13.5,<3.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "ruff>=0.16.8", "mypy>=2.3.1"]

[tool.pytest.ini_options]
addopts = "-q"
