[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-document-production-api"
version = "0.1.0"
description = "Local-first deterministic document production API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "mypy>=1.13,<3", "ruff>=0.8,<1", "types-reportlab>=4,<6"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
