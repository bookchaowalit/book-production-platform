[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-production-platform"
version = "0.1.0"
description = "Deterministic local production adapters and validated intermediate representations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.13,<3", "Pillow>=12,<13", "xlsxwriter>=3.2,<4"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=9,<10", "ruff>=0.8,<1"]

[project.scripts]
book-production = "book_production_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_production_platform = [
    "audio_ir/*.json",
    "cad_ir/*.json",
    "cad_production/*.json",
    "cad_production/*.FCMacro",
    "game_production/templates/unity_project/.gitattributes",
    "game_production/templates/unity_project/.book-production/worker-input.json",
    "game_production/templates/unity_project/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
