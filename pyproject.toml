[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-production-platform"
version = "0.1.0"
description = "Deterministic local production adapters and validated intermediate representations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.13,<3", "Pillow>=12,<13", "xlsxwriter>=3.2,<4"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=9,<10", "ruff>=0.8,<1"]
# Local PNG previews without a browser (Graphics); optional.
preview = ["resvg-py>=0.2,<1"]
# Thai word-boundary line breaks in Graphics (PyThaiNLP newmm; no model download).
thai = ["pythainlp>=5.1,<6"]
# AI background removal for placed photos (rembg U2-Net on CPU; the model is cached locally, U2NET_HOME).
cutout = ["rembg[cpu]>=2.0.60,<3"]

[project.scripts]
book-production = "book_production_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_production_platform = [
    "audio_ir/*.json",
    "cad_ir/*.json",
    "graphics_production/themes/*.json",
    "cad_production/*.json",
    "cad_production/*.FCMacro",
    "bim_ir/*.json",
    "bim_production/*.json",
    "bim_production/*.FCMacro",
    "game_production/templates/unity_project/.gitattributes",
    "game_production/templates/unity_project/.book-production/worker-input.json",
    "game_production/templates/unity_project/**/*",
    "game_production/exporter/*.cs",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
# Job locking and the BIM runtime use Windows-only APIs (msvcrt, ctypes.WinDLL,
# os.add_dll_directory) behind os.name checks that mypy cannot narrow. Pin the
# checked platform to the primary Windows host so strict mypy gives the same
# result on Linux CI and developer machines; POSIX branches load fcntl
# dynamically and stay typed as Any.
platform = "win32"

[[tool.mypy.overrides]]
# The scene3d internals include Blender-worker modules and are intentionally
# not part of MYPY_TARGETS; pipeline code imports their public functions, so
# use their types while keeping the gate free of pre-existing scene3d findings.
module = "book_production_platform.scene3d.*"
follow_imports = "silent"
