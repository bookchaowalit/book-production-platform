[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-production-platform"
version = "0.1.0"
description = "Deterministic local production adapters and validated intermediate representations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "Pillow>=12,<13"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
book-production = "book_production_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
