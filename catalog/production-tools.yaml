# Production tools catalog — single source of truth (roadmap T5.1).
# Every tool records its owning repo, a real CLI entry point, input schema,
# output artifacts, required runtimes, gate status, and evidence references.
# The generated dashboard page is dashboard/PRODUCTION-TOOLS.md; regenerate it
# with `task production-tools:write` and verify drift with
# `task production-tools:check` (infra/scripts/utils/production_tools_catalog_guard.py).
#
# Gate statuses are filled ONLY from recorded evidence. This guard never
# probes local runtimes; runtime probing belongs to `book-production doctor`
# (roadmap T5.2) inside the owning repository.
#
# owning_repo is a GitHub repository (bookchaowalit/<repo>). cli_entry_point and a
# path input_schema are relative to that repository; evidence paths are relative to
# this repository. cli_command and paths inside notes run from owning_repo.
schema_version: solo-empire.production-tools.v1
catalog_path: catalog/production-tools.yaml
dashboard_page: dashboard/PRODUCTION-TOOLS.md
runtime_vocabulary:
  - blender
  - ffmpeg
  - freecadcmd
  - unity
gate_statuses:
  accepted: synthetic acceptance gate passed
  pilot-ready: deterministic gate passed; human/visual gate pending
  needs-human-gate: waiting for a recorded human review gate (listening/visual/fresh-install smoke)
  blocked: cannot proceed until an external dependency is resolved
  experimental: implementation exists without a recorded acceptance gate
notes: >-
  Enumeration (2026-09-26) found 15 production tools with real entry points
  and recorded evidence, not the 13 approximated in the roadmap overview.
  Documents V1A.1 and Documents V1C Scan Import share one service and CLI and
  are one entry; the two audio tools are separate products in separate
  repositories (batch preparation vs single-track mastering).

tools:
  # --- Book Production Platform: services/ (moved from the root 2026-10-09) ---
  - id: documents-v1a
    name: Documents V1A.1 + V1C Scan Import
    owning_repo: bookchaowalit/content-production
    cli_entry_point: services/document-production-api/document_production/cli.py
    cli_command: "python -m document_production.cli render|smoke|scan"
    input_schema: DocumentRequest (document render) / ScanImportRequest typed models (scan source is a PDF, DOCX, or PNG/JPEG/TIFF/WebP image)
    outputs:
      - DOCX
      - PDF
      - QA manifest
      - scan import proposals + QA manifest
    runtimes: []
    gate_status: pilot-ready
    boundary_modules: []
    notes: >-
      V1A.1 hardening accepted (pytest 83 passed, ruff, strict mypy, smoke
      fresh + replayed, root commit 1dcf44b9). Visual golden evidence is still
      pending. V1C Scan Import passed its synthetic gate; real Poppler +
      Tesseract OCR runtime is not installed or verified on this host.
      V1B AI brief adapter (2026-10-03): real Central AI Gateway adapter on packages/brief-
      adapter-kit, fail-closed config with rate card and per-job/day/month caps, grounding,
      brief-shadow evaluator; mode stays shadow until the owner approves a rate card and a
      held-out shadow run passes.
    evidence:
      - docs/superpowers/plans/2026-09-26-production-tools-roadmap.md#t2-documents-v1a1--เสริมความทนทาน
      - docs/superpowers/plans/2026-09-22-production-platform-next-products.md#14-documents-v1c-scan-import--synthetic-gate-evidence-2026-09-24

