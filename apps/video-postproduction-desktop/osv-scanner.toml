# Reviewed OSV exceptions (DevSecOps Phase 1). Each entry needs a reason and an expiry.
#
# All of these are devDependencies of the Electron Forge 7 packaging toolchain
# (@electron-forge/cli 7.11.2). They run only on the developer machine when packaging
# (`npm run make`) and are not shipped in the app. None has a fix that Forge 7 accepts:
# @electron-forge/cli 8 resolves every one of them, but it is a major upgrade of the
# Windows Squirrel packaging path that has to be verified with a real `npm run make`
# on Windows, so it is a follow-up rather than part of the CI rollout.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-17
reason = "Dev-only Electron Forge 7 packaging dependency: braces (fast-glob/micromatch in @electron-forge/core): no fixed 3.x release. Fixed by the Forge 8 upgrade (follow-up)."

