name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs the same gate as `python scripts/check.py`: the full pytest suite,
    # Ruff on the owned modules and strict mypy. Blender, FreeCAD and Unity are
    # not installed, so their real-runtime tests skip with an explicit reason.
    # FFmpeg and the runner's preinstalled Google Chrome are used so the audio,
    # game-asset and graphics rendering tests run for real.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Show local runtimes
        run: book-production doctor

      - name: Run checks
        run: python scripts/check.py
